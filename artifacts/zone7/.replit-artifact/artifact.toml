kind = "web"
previewPath = "/"
title = "Zone7"
description = "Zone7 is a cinematic production house portfolio app showcasing music videos, commercials, behind-the-scenes content, and brand collaborations. It features an admin panel for content management, booking flows, and a luxury dark aesthetic reflecting the brand's creative direction."
version = "1.0.0"
id = "artifacts/zone7"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21766

[services.development]
run = "pnpm --filter @workspace/zone7 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zone7", "run", "build" ]
serve = "static"
publicDir = "artifacts/zone7/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21766"
BASE_PATH = "/"
